name: Candidate decision

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  decide:
    if: |
      github.event.issue.pull_request == null &&
      contains(join(github.event.issue.labels.*.name, ','), 'candidate') &&
      (startsWith(github.event.comment.body, '/approve') || startsWith(github.event.comment.body, '/reject'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply decision
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: npm run approve
      - name: Open vendor PR
        if: startsWith(github.event.comment.body, '/approve')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No vendor changes"
            exit 0
          fi
          branch="vendor/issue-${{ github.event.issue.number }}"
          git checkout -b "$branch"
          git add catalog/skills.yaml catalog/stars.yaml skills README.md
          git commit -m "feat: vendor skill from candidate #${{ github.event.issue.number }}"
          git push -u origin "$branch"
          gh pr create \
            --title "feat: vendor skill from candidate #${{ github.event.issue.number }}" \
            --body "Approved via /approve on #${{ github.event.issue.number }}." \
            --head "$branch"
      - name: Commit rejection
        if: startsWith(github.event.comment.body, '/reject')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/rejected.yaml
          if git diff --cached --quiet; then
            echo "No rejection catalog changes"
            exit 0
          fi
          git commit -m "chore: reject candidate #${{ github.event.issue.number }}"
          git push
