<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="168" viewBox="0 0 1200 168" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">使用流程</title>
  <desc id="wf-desc">三步使用创作技能合集：按渠道浏览、一条命令安装、在 Agent 中直接调用。</desc>

  <rect width="1200" height="168" rx="24" fill="#141312"/>
  <rect x="1" y="1" width="1198" height="166" rx="23" fill="none" stroke="#2C2924"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif">
    <g transform="translate(36 28)">
      <rect width="352" height="112" rx="16" fill="#1C1A17" stroke="#2E2B26"/>
      <text x="28" y="38" fill="#C9A36A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.6">01</text>
      <text x="28" y="70" fill="#F3EFE4" font-size="22" font-weight="600">浏览目录</text>
      <text x="28" y="96" fill="#8E877A" font-size="16">按平台、类型或形式检索技能</text>
    </g>

    <path d="M404 84h28" stroke="#C9A36A" stroke-width="2"/>
    <path d="M428 78l8 6-8 6" fill="none" stroke="#C9A36A" stroke-width="2"/>

    <g transform="translate(448 28)">
      <rect width="352" height="112" rx="16" fill="#1C1A17" stroke="#2E2B26"/>
      <text x="28" y="38" fill="#C9A36A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.6">02</text>
      <text x="28" y="70" fill="#F3EFE4" font-size="22" font-weight="600">安装技能</text>
      <text x="28" y="96" fill="#8E877A" font-size="16">一条命令加入当前 Agent</text>
    </g>

    <path d="M816 84h28" stroke="#C9A36A" stroke-width="2"/>
    <path d="M840 78l8 6-8 6" fill="none" stroke="#C9A36A" stroke-width="2"/>

    <g transform="translate(860 28)">
      <rect width="304" height="112" rx="16" fill="#1C1A17" stroke="#2E2B26"/>
      <text x="28" y="38" fill="#C9A36A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.6">03</text>
      <text x="28" y="70" fill="#F3EFE4" font-size="22" font-weight="600">在 Agent 中调用</text>
      <text x="28" y="96" fill="#8E877A" font-size="16">用于写作、配图与发布</text>
    </g>
  </g>
</svg>
